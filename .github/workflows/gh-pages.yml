name: Github Pages

on:
  push:
  pull_request:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Setup NodeJS LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Run unit tests
        run: npm run test:unit
      - name: Run component tests
        run: npm run test:components
      - name: Build application
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: playground
          path: dist/

  build-for-deployment:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - branch: main
            base_path: ${{ vars.BASE_PATH }}
            shackle: false
          - branch: develop
            base_path: ${{ vars.BASE_PATH }}/develop
            shackle: false
          - branch: develop
            base_path: ${{ vars.BASE_PATH }}/shackle
            shackle: true
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
      - name: Setup NodeJS LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Download shackle-wasm package
        if: matrix.shackle
        env:
          GH_TOKEN: ${{ github.token }}
          SHACKLE_WASM_REPOSITORY: ${{ vars.SHACKLE_WASM_REPOSITORY || 'shackle-rs/shackle' }}
          SHACKLE_WASM_TAG: shackle-wasm-edge
        run: |
          set -euo pipefail
          gh release download "$SHACKLE_WASM_TAG" --repo "$SHACKLE_WASM_REPOSITORY" \
            --pattern shackle-wasm-pkg.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/shackle-wasm-pkg.tar.gz"
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Run unit tests
        run: npm run test:unit --if-present
      - name: Run component tests
        run: npm run test:components --if-present
      - name: Build application
        run: npm run build
        env:
          BASE_PATH: ${{ matrix.base_path }}
          VITE_SHACKLE: ${{ matrix.shackle && 'true' || 'false' }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          # The Shackle build has a distinct artifact name despite using the
          # same source branch as the normal development deployment.
          name: playground-${{ matrix.shackle && 'shackle' || matrix.branch }}
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: [build-for-deployment]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch main build
        uses: actions/download-artifact@v8
        with:
          name: playground-main
          path: ${{ github.workspace }}/dist
      - name: Fetch develop build
        uses: actions/download-artifact@v8
        with:
          name: playground-develop
          path: ${{ github.workspace }}/dist/develop
      - name: Fetch Shackle build
        uses: actions/download-artifact@v8
        with:
          name: playground-shackle
          path: ${{ github.workspace }}/dist/shackle
      - name: Upload combined site as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
